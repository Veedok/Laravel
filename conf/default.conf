server {
    listen 80;
    server_name veedok.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name veedok.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/veedok.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veedok.duckdns.org/privkey.pem;

    root /var/www/app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}