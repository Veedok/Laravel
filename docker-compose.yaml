services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    command: supervisord -n -c /etc/supervisor/supervisord.conf
    volumes:
      - ./app:/var/www/app
      - ./conf/supervisord.conf:/etc/supervisor/supervisord.conf
      - ./conf/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-gd.ini
    environment:
      PHP_IDE_CONFIG: 'serverName=passport.localhost'
      XDEBUG_MODE: debug
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
  nginx:
    image: nginx:latest
    volumes:
      - ./conf/default.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www/app
    networks:
      default:
        ipv4_address: 172.20.84.10
    depends_on:
      - laravel
    restart: always
  laravel_db:
    image: postgres:latest
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: IcdNBs3bRY
      POSTGRES_DB: my_laravel_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d passport" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
networks:
  default:
    name: develop
    external: true
volumes:
  postgres_data:
